<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Mirna Alvarez Bran | Cárdiologa Pediatra</title>
    
    <!-- Enlace oficial de Font Awesome para cargar los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style type="text/css">
        /* Estilos base para centrar todo el contenido en pantalla */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor principal de la tarjeta de presentación */
        .card-container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 450px;
            width: 100%;
            padding: 30px;
            text-align: center;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center; /* Alinea verticalmente todos los bloques de la tarjeta */
        }

        /* Encabezado del perfil con el logo perfectamente centrado */
        .profile-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center; /* Centra el contenido horizontalmente */
            justify-content: center; /* Centra el contenido verticalmente si aplica */
            text-align: center;
        }

        .profile-header img {
            max-width: 220px; /* Tamaño controlado para que el logo luzca estético */
            width: 100%;
            height: auto;
            margin: 0 auto 15px auto; /* Margen automático izquierdo y derecho para centrado absoluto */
            display: block; /* Elimina espacios residuales en línea */
        }

        h1 {
            font-size: 26px;
            color: #333333;
            margin: 10px 0 5px 0;
            font-weight: 600;
            width: 100%;
        }

        /* Biografía corta de la doctora */
        .bio {
            font-size: 16px;
            color: #666666;
            line-height: 1.5;
            margin: 15px 0 25px 0;
            width: 100%;
        }

        /* Contenedor horizontal para alinear los iconos uno a la par del otro */
        .links-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px; /* Espacio cómodo entre iconos */
            margin-bottom: 25px;
            flex-wrap: wrap;
            width: 100%;
        }

        /* Estilo para los iconos planos y limpios, sin círculos de fondo */
        .btn-icon {
            text-decoration: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        /* Efecto sutil al pasar el mouse por encima */
        .btn-icon:hover {
            transform: scale(1.15);
            opacity: 0.85;
        }

        /* Asignación directa de colores característicos a cada icono suelto */
        .icon-email {
            color: #ea4335; /* Rojo para el correo */
        }

        .icon-whatsapp {
            color: #25d366; /* Verde para WhatsApp */
        }

        .icon-waze {
            color: #33ccff; /* Celeste para Waze */
        }

        .icon-phone {
            color: #007bff; /* Azul para llamadas */
        }

        /* Estilo del pie de página */
        .footer {
            border-top: 1px solid #eeeeee;
            padding-top: 15px;
            margin-top: 20px;
            width: 100%;
        }

        .footer p {
            font-size: 13px;
            color: #999999;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Foto de perfil o Logo Centrado Absoluto -->
        <div class="profile-header">
            <img height="600" width="700" src="LOGO 2 Dr. Mirna ALvarez Bran 1080.png" alt="Logo Dra. Mirna Alvarez Bran">
        </div>

        <!-- Biografía corta -->
        <p class="bio">
            Cardióloga Pediatra especializada en el diagnóstico y tratamiento de arritmias cardíacas infantiles.
        </p>

        <!-- Botones de contacto en formato de iconos sueltos sin fondo -->
        <div class="links-container">
            <!-- Icono de Correo -->
            <!-- Icono de Correo Corregido y sin target -->
<a href="mailto:alv13959@gmail.com" class="btn-icon icon-email" title="Enviar Correo">
   <i class="fa-solid fa-envelope fa-3x"></i>
</a>
</a>
            
            <!-- Icono de WhatsApp -->
            <a href="https://wa.me" target="_blank" rel="noopener" class="btn-icon icon-whatsapp" title="Escríbenos por WhatsApp">
               <i class="fa-brands fa-whatsapp fa-3x"></i>
            </a>
            
            <!-- Icono de Waze -->
             <a href="https://waze.com" target="_blank" rel="noopener" class="btn-icon icon-waze" title="Ubicación en Waze">
               <i class="fa-solid fa-location-dot fa-3x"></i>
            
            <!-- Icono de Teléfono -->
            <a href="tel:+50224249473" class="btn-icon icon-phone" title="Llamar por Teléfono">
               <i class="fa-solid fa-phone fa-3x"></i>
            </a>
        </div>

        <!-- Pie de página -->
        <div class="footer">
            <p>&copy; 2026 Dr. Mirna Alvarez Bran. Guatemala.</p>
        </div>
    </div>

</body>
</html>
